<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sorpresita del día 3 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;700&family=Dancing+Script:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Sorpresita del día 3</h1>
    <div class="score" aria-live="polite"><span id="count">0</span> / <span id="goal">10</span> <span class="h">♥</span></div>
  </header>

  <div class="stage">
    <canvas id="game" width="360" height="520" aria-label="Minijuego"></canvas>

    <div class="overlay" id="intro">
      <p class="script">Ayúdame a juntar los corazoncitos</p>
      <p class="small">Mueve a tu personaje con el dedo (o con las flechas). Esquiva lo que no sea corazón. Cuando juntes todos, se abre tu carta.</p>
      <button id="start" type="button">Empezar</button>
    </div>

    <div class="overlay hidden" id="letter" role="dialog" aria-labelledby="letterTitle">
      <div class="paper">
        <p class="script big" id="letterTitle"></p>
        <p class="body" id="letterBody"></p>
        <p class="script sign" id="letterSign"></p>
        <button id="again" type="button">Jugar otra vez</button>
      </div>
    </div>
  </div>

  <div class="pad">
    <button id="left" type="button" aria-label="Mover a la izquierda">◀</button>
    <button id="right" type="button" aria-label="Mover a la derecha">▶</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
